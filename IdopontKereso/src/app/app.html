<div class="flex flex-col h-screen w-full">

  <app-navbar (menuToggled)="sidenav.toggle()"></app-navbar>

  <mat-sidenav-container class="flex-1 w-full bg-transparent">
    
    <mat-sidenav 
      #sidenav 
      mode="side" 
      [opened]="isSidebarOpen()" 
      (openedChange)="isSidebarOpen.set($event)">
      
      <div class="flex flex-col h-full p-4">
        
        <div class="flex flex-col gap-4">
          <button
            (click)="openEventDialog()"
            class="w-full py-3 px-4 bg-amber-300 hover:bg-amber-400 text-amber-900 font-bold rounded-xl transition-colors shadow-sm flex items-center"> 
            <mat-icon>add</mat-icon>
            <span class="flex-1 text-center px-2">Hozzáadás</span>
          </button>
          
          <button
            (click)="navigateToFindTime()"
            class="w-full py-3 px-4 bg-amber-300 hover:bg-amber-400 text-amber-900 font-bold rounded-xl transition-colors shadow-sm flex items-center"> 
            <mat-icon>search</mat-icon>
            <span class="flex-1 text-center px-2">Keresés</span>
          </button>
        </div>

        <div class="my-auto mb-auto bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-none rounded-xl overflow-hidden p-1 shadow-inner transform origin-top -mb-4">
          <mat-calendar 
            class="text-gray-800 dark:text-gray-100"
            [selected]="calendarRefreshService.selectedDate()" 
            (selectedChange)="onDateSelected($event)">
          </mat-calendar>
        </div>
        
        <div class="pt-4 border-t border-gray-300 dark:border-gray-600/50 mt-4 shrink-0 flex items-center gap-1.5">

          <mat-slide-toggle 
              class="instant-toggle"
              [checked]="calendarRefreshService.interactionsEnabled()" 
              (change)="calendarRefreshService.interactionsEnabled.set($event.checked)"
              color="primary" class="preload-transitions">
            <span class="text-gray-800 dark:text-gray-200 text-sm font-medium">Naptár interakciók</span>
          </mat-slide-toggle>
          
          <mat-icon 
            class="text-gray-500 dark:text-gray-400 text-[18px] w-[18px] h-[18px] cursor-pointer"
            matTooltip="Kikapcsolva megakadályozza a véletlen esemény létrehozást és áthelyezést.">
            info
          </mat-icon>
        </div>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="flex flex-col overflow-auto">
      <main class="flex-1 w-full h-full">
          <router-outlet />
      </main>
    </mat-sidenav-content>

  </mat-sidenav-container>

</div>
