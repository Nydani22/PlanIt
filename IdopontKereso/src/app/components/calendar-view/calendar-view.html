<div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm">
    <div class="flex flex-col lg:flex-row justify-between items-center mb-6 gap-4">
        
        <div class="flex flex-wrap justify-center gap-2">
            <button mat-flat-button color="primary" mwlCalendarPreviousView [view]="view" [(viewDate)]="viewDate">
                Előző
            </button>
            <button mat-flat-button color="primary" mwlCalendarToday [(viewDate)]="viewDate">
                Ma
            </button>
            <button mat-flat-button color="primary" mwlCalendarNextView [view]="view" [(viewDate)]="viewDate">
                Következő
            </button>
        </div>
        
        <div class="text-2xl font-bold text-gray-800 dark:text-gray-100 uppercase tracking-wide text-center">
            {{ viewDate | date:'yyyy MMM' }}
        </div>
        
        <div class="flex flex-wrap justify-center gap-2">
            <button
                mat-flat-button 
                [color]="view === CalendarView.Month ? 'primary' : ''"
                (click)="setView(CalendarView.Month)"
            >
                Hónap
            </button>
            <button
                mat-flat-button 
                [color]="view === CalendarView.Week ? 'primary' : ''"
                (click)="setView(CalendarView.Week)"
            >
                Hét
            </button>
            <button
                mat-flat-button 
                [color]="view === CalendarView.Day ? 'primary' : ''"
                (click)="setView(CalendarView.Day)"
            >
                Nap
            </button>
        </div>
    </div>

    @switch (view) { 
        @case (CalendarView.Month) {
            <mwl-calendar-month-view
                [viewDate]="viewDate"
                [events]="events"
                [refresh]="refresh"
                [weekStartsOn]="1"
                locale="hu"
            />
        } 
        @case (CalendarView.Week) {
            <mwl-calendar-week-view
                [viewDate]="viewDate"
                [events]="events"
                [refresh]="refresh"
                [weekStartsOn]="1"
                locale="hu"
                [dayStartHour]="dayStartHour"
                [dayEndHour]="dayEndHour"
            />
        } 
        @case (CalendarView.Day) {
            <mwl-calendar-day-view
                [viewDate]="viewDate"
                [events]="events"
                [refresh]="refresh"
                (eventTimesChanged)="eventTimesChanged($event)"
                locale="hu"
                [dayStartHour]="dayStartHour"
                [dayEndHour]="dayEndHour"
            />
        } 
    }
</div>
