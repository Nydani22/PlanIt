<h2 mat-dialog-title class="flex items-center gap-2 text-gray-800 dark:text-gray-100">
    <span class="text-lg font-bold">{{ isEditMode ? 'Naptár szerkesztése' : 'Új naptár hozzáadása' }}</span>
</h2>

<mat-dialog-content class="scrollbar-thin scrollbar-thumb-gray-300 dark:scrollbar-thumb-gray-700 !pt-2">
    <form [formGroup]="calendarForm" class="flex flex-col gap-4">
        
        <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
            <mat-label>Naptár neve</mat-label>
            <mat-icon matPrefix class="text-gray-400 dark:text-gray-500 mr-2 ml-1">label</mat-icon>
            <input matInput formControlName="name" placeholder="Pl. Egyetemi Órarend">
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
            <mat-label>iCal URL (.ics link)</mat-label>
            <mat-icon matPrefix class="text-gray-400 dark:text-gray-500 mr-2 ml-1">link</mat-icon>
            <input matInput formControlName="url" type="url" placeholder="https://pelda.hu/naptar.ics">
        </mat-form-field>

        <label class="flex items-center justify-between p-3.5 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50/50 dark:bg-gray-800/30 transition-colors hover:border-gray-400 dark:hover:border-gray-500 cursor-pointer relative overflow-hidden mt-1">
            <div class="flex items-center gap-3 pointer-events-none">
                <mat-icon class="text-gray-500 dark:text-gray-400">palette</mat-icon>
                <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Naptár színe</span>
            </div>
            
            <div class="w-8 h-8 rounded-md overflow-hidden shadow-sm border border-gray-200 dark:border-gray-600 shrink-0 relative">
                <input type="color" formControlName="color" class="absolute -top-4 -left-4 w-16 h-16 cursor-pointer border-0 p-0">
            </div>
        </label>

    </form>
</mat-dialog-content>

<mat-dialog-actions class="flex w-full items-center !px-6 !pb-6 !pt-2">
    <div>
        @if (isEditMode) {
            <button mat-button color="warn" type="button" (click)="deleteCalendar()">
                <mat-icon>delete</mat-icon> Törlés
            </button>
        }
    </div>
    
    <div class="flex gap-2 ml-auto">
        <button mat-button mat-dialog-close>Mégsem</button>
        <button mat-flat-button color="primary" [disabled]="calendarForm.invalid" (click)="save()">
            {{ isEditMode ? 'Mentés' : 'Hozzáadás' }}
        </button>
    </div>
</mat-dialog-actions>
