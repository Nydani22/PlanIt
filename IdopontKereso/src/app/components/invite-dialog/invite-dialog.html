<div class="text-center pt-6 pb-2">
  <div class="m-0 text-2xl font-bold text-gray-800 pb-4">
    Meghívó link
  </div>
  <p class="text-gray-500 text-sm mt-2 mb-0 px-4 leading-relaxed">
    Oszd meg az alábbi linket vagy QR kódot, hogy mások is csatlakozhassanak a(z) 
    <span class="font-bold text-gray-700">{{ data.groupName || 'csoport' }}</span> csoporthoz!
  </p>
</div>

<mat-dialog-content class="flex flex-col items-center text-center px-6 pb-4 overflow-hidden">
  
  <div class="w-full flex justify-center my-5">
    <div class="p-3 bg-white rounded-2xl shadow-sm border border-gray-200 inline-flex">
      <img [src]="'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=' + data.inviteUrl" 
           alt="QR Kód" 
           class="w-40 h-40 block">
    </div>
  </div>
  
  <div class="flex items-center w-full rounded-xl p-1 border mx-auto transition-all duration-300"
       [ngClass]="isCopied() ? 'bg-green-50 border-green-500 shadow-sm' : 'bg-gray-50 border-gray-200'">
    
    <span class="flex-1 text-sm font-mono truncate px-3 text-left select-all transition-colors duration-300"
          [ngClass]="isCopied() ? 'text-green-800' : 'text-gray-700'">
      {{ data.inviteUrl }}
    </span>
    
    <button mat-icon-button 
            (click)="copyLink()" 
            title="Másolás" 
            class="shrink-0 transition-colors duration-300"
            [color]="isCopied() ? '' : 'primary'"
            [ngClass]="{'!text-green-600': isCopied()}">
      <div class="inline-grid place-items-center">
        <mat-icon class="col-start-1 row-start-1 transition-all duration-300 transform"
                  [ngClass]="isCopied() ? 'opacity-0 scale-50 rotate-90' : 'opacity-100 scale-100 rotate-0'">
          content_copy
        </mat-icon>
        <mat-icon class="col-start-1 row-start-1 transition-all duration-300 transform"
                  [ngClass]="isCopied() ? 'opacity-100 scale-100 rotate-0' : 'opacity-0 scale-50 -rotate-90'">
          check
        </mat-icon>
      </div>
    </button>
  </div>
  
</mat-dialog-content>

<mat-dialog-actions align="center">
    <div class="pb-4">
        <button mat-flat-button color="primary" mat-dialog-close>
            Kész
        </button>
    </div>
</mat-dialog-actions>
