<h2 mat-dialog-title class="m-0 text-xl font-bold text-gray-800">{{ data.title }}</h2>
    
    <mat-dialog-content class="pt-4 pb-2">
      <p class="text-gray-600 mb-4 leading-relaxed">{{ data.message }}</p>
      
      <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
        <mat-label>{{ data.placeholder || 'Írd be ide...' }}</mat-label>
        <input matInput [(ngModel)]="inputValue" (keyup.enter)="onConfirm()" autofocus>
      </mat-form-field>
    </mat-dialog-content>
    
    <mat-dialog-actions align="end" class="pb-4 pr-6">
        
    <button mat-button (click)="onCancel()">
        {{ data.cancelText || 'Mégsem' }}
    </button>

    <button mat-flat-button [color]="data.color || 'primary'" (click)="onConfirm()" [disabled]="!inputValue.trim()">
        {{ data.confirmText || 'Rendben' }}
    </button>

</mat-dialog-actions>
