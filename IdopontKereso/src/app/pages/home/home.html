<div class="min-h-screen bg-gray-50 p-4 md:p-8"> 
  <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6"> 
    
    <div class="flex-1 bg-white rounded-xl shadow-lg overflow-hidden min-h-125"> 
        <app-calendar-view class="w-full h-full"></app-calendar-view> 
    </div> 

    <div class="w-full lg:w-96 flex flex-col gap-6"> 
      
      <div class="bg-white p-6 rounded-xl shadow-lg flex flex-col justify-center items-center h-48"> 
        <h3 class="text-lg font-bold mb-4 text-gray-700">Események kezelése</h3> 
        
        <button
            (click)="openEventDialog()"
            class="w-full mt-2 py-3 bg-amber-300 hover:bg-amber-400 text-amber-900 font-bold rounded-xl transition-colors shadow-sm"> 
            Új Esemény Létrehozása 
        </button>

        @if (successMessage()) { 
            <p class="text-green-600 text-center font-bold mt-4 text-sm animate-pulse"> 
                {{ successMessage() }} 
            </p> 
        } 
      </div>

      <div class="bg-amber-300 rounded-xl p-6 shadow-lg min-h-37.5 flex items-center justify-center text-2xl font-bold text-amber-900"> 
        03 
      </div> 

    </div> 

  </div> 
</div>
